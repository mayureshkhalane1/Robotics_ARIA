[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-aria"
version = "0.1.0"
description = "Agentic Robot Intelligence Architecture for Webots robot control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp==3.11.0",
    "anthropic==0.38.0",
    "imagehash>=4.3.2",
    "langgraph==0.2.76",
    "langgraph-checkpoint==2.1.2",
    "networkx>=3.2.1",
    "opencv-python>=4.13.0.92",
    "pillow>=11.3.0",
    "pydantic==2.10.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "ultralytics>=8.4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aria-agent = "src.agent.main:main"
aria-ui = "src.ui.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
